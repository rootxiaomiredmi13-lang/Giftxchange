<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GiftXchange — обмен NFT-подарками</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="core.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#000;--s1:#121214;--s2:#1b1b1f;--s3:#26262b;--s4:#313137;
  --line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.11);
  --text:#fff;--muted:#8c8d96;--dim:#5c5d66;
  --blue:#2f8cff;--blue-d:#1f74e6;--blue-t:rgba(47,140,255,.14);
  --ok:#30c77b;--warn:#ffb340;--bad:#ff4d5e;--star:#ffc83d;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + var(--safe-b));overscroll-behavior-y:none;min-height:100vh;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.bgfx{display:none}
.app{max-width:720px;margin:0 auto;position:relative}
/* Поверхность (раньше «стекло») — сплошная, без размытия: дёшево для GPU */
.glass{background:var(--s1);border:1px solid var(--line)}

/* Шапка */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 14px 8px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.4px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--blue);flex:none}
.logo svg{width:19px;height:19px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:1px}
.pill-demo{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--warn);background:rgba(255,179,64,.12);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.tright{display:flex;align-items:center;gap:6px;min-width:0}
.me{display:flex;align-items:center;gap:7px;border-radius:999px;padding:3px 11px 3px 3px;font-size:13px;font-weight:700;max-width:160px;background:var(--s2);border:0}
.me .ava{width:28px;height:28px}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plusb{width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none;transition:transform .15s var(--ease)}
.plusb:active{transform:scale(.9)}
.plusb svg{width:18px;height:18px}
.ava{border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:var(--blue);overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}

/* Промо-полоса вместо большого баннера */
.promo{margin:4px 14px 10px;border-radius:16px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;width:calc(100% - 28px);text-align:left;
  background:linear-gradient(100deg,#123a73 0%,#16274a 55%,#141a2a 100%);border:1px solid rgba(80,150,255,.22);transition:transform .15s var(--ease)}
.promo:active{transform:scale(.985)}
.promo .pi{width:40px;height:40px;border-radius:12px;background:rgba(47,140,255,.28);display:grid;place-items:center;flex:none;color:#cfe3ff}
.promo .pi svg{width:20px;height:20px}
.promo div{flex:1;min-width:0}
.promo b{display:block;font-size:14.5px;font-weight:750}
.promo span{display:block;font-size:12px;color:#a9bddf;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo .go{color:#a9bddf;flex:none;display:grid}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 14px 10px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.stat{padding:9px 12px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:16px;font-weight:750;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:11px}

/* Поиск и фильтры — сплошной фон, без размытия */
.toolbar{position:sticky;top:0;z-index:5;padding:8px 0 4px;background:var(--bg)}
.searchrow{display:flex;gap:8px;padding:0 14px 8px}
.search{flex:1;display:flex;align-items:center;gap:8px;border-radius:12px;padding:0 11px;min-width:0;background:var(--s2);border:1px solid transparent;transition:border-color .2s}
.search:focus-within{border-color:var(--blue)}
.search svg{width:17px;height:17px;color:var(--dim);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:10px 0;font-size:14px}
.search input::placeholder{color:var(--dim)}
.search .clear{display:none;width:20px;height:20px;border-radius:50%;background:var(--s4);color:var(--muted);font-size:14px;line-height:1}
.search.has .clear{display:grid;place-items:center}
.sq{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;color:#cfd0d8;background:var(--s2);border:0;transition:transform .15s var(--ease)}
.sq:active{transform:scale(.92)}
.sq svg{width:18px;height:18px}
.chips{display:flex;gap:6px;padding:0 14px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:650;color:#c4c5cd;background:var(--s2);border:0;transition:background .2s,color .2s,transform .15s var(--ease)}
.chip .n{opacity:.5;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.active{background:var(--blue-t);color:#7db6ff}
.chip.active .n{opacity:.8}

.shead{display:flex;align-items:baseline;justify-content:space-between;padding:10px 16px 8px}
.shead h2{margin:0;font-size:20px;letter-spacing:-.4px;font-weight:800}
.shead small{color:var(--muted);font-size:12px}
.sub{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:16px 4px 8px;display:flex;justify-content:space-between}
.content{padding:0 12px}

/* Карточки как в Portals: плотная сетка, фон подарка, синяя кнопка */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:350px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border-radius:14px;overflow:hidden;position:relative;text-align:left;padding:0;cursor:pointer;background:var(--s1);border:1px solid var(--line);
  transition:transform .18s var(--ease);contain:layout paint;content-visibility:auto;contain-intrinsic-size:auto 200px}
.card:active{transform:scale(.965)}
.thumb{position:relative;aspect-ratio:1;overflow:hidden;background:var(--s2)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 50% 40%,#2a2d3a,#15161c)}
.tag{position:absolute;font-size:10px;font-weight:750;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.55);font-variant-numeric:tabular-nums;line-height:1.2}
.tag.st{left:5px;top:5px}
.tag.st.ok{display:none}
.tag.st.busy{color:var(--warn)}.tag.st.mine{color:#8cc4ff}.tag.st.out{color:#d2b8ff}
.tag.num{display:none}
.favb{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;transition:transform .2s var(--spring)}
.favb:active{transform:scale(.82)}
.favb svg{width:13px;height:13px}
.favb.on{color:#ff4d6d}.favb.on svg{fill:currentColor}
.info{padding:7px 7px 7px}
.info .t{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.info .o{display:flex;align-items:center;gap:4px;margin-top:1px;color:var(--muted);font-size:11px;min-width:0;white-space:nowrap;overflow:hidden}
.info .o span{overflow:hidden;text-overflow:ellipsis}
.cta{position:relative;margin-top:7px;width:100%;border-radius:9px;padding:7px 0;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .15s var(--ease),background .2s}
.cta:active{transform:scale(.95)}
.cta svg{width:13px;height:13px}
.cta.p{background:var(--blue);color:#fff}
.cta.p:active{background:var(--blue-d)}
.cta.s{background:var(--s3);color:#d4d5dc}

.sk{background:var(--s2);border-radius:8px;animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}

.empty{border-radius:18px;padding:28px 20px;text-align:center}
.empty .ic{width:58px;height:58px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;background:var(--blue-t);color:#7db6ff}
.empty .ic svg{width:26px;height:26px}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0 auto 16px;color:var(--muted);font-size:13px;line-height:1.55;max-width:320px}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14.5px;background:var(--blue);color:#fff;transition:transform .15s var(--ease),opacity .2s,background .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.block{width:100%}
.btn.sec{background:var(--s3);color:#e6e7ec}
.btn.danger{background:rgba(255,77,94,.13);color:#ff6b79}
.btn.okb{background:var(--ok);color:#03200f}
.btn.star{background:linear-gradient(135deg,#ffb020,#ffd34d);color:#3a2500}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}

.addcard{border-radius:16px;padding:13px;display:flex;align-items:center;gap:12px;margin:0 0 6px;width:100%;text-align:left;background:var(--s1);border:1px dashed rgba(47,140,255,.45);transition:transform .15s var(--ease)}
.addcard .ic{width:42px;height:42px;border-radius:12px;background:var(--blue);display:grid;place-items:center;flex:none}
.addcard .ic svg{width:21px;height:21px}
.addcard div{flex:1;min-width:0}
.addcard b{display:block;font-size:14.5px}
.addcard span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.addcard .go{width:30px;height:30px;border-radius:50%;background:var(--s3);display:grid;place-items:center;flex:none;color:var(--muted)}

.item{border-radius:14px;padding:9px;display:flex;align-items:center;gap:11px;margin-bottom:6px}
.item .pic{width:48px;height:48px;border-radius:11px;overflow:hidden;flex:none;background:var(--s2);position:relative}
.item .pic img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .side-btn{flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;white-space:nowrap}
.badge.pending,.badge.awaiting_payment,.badge.payment_claimed{background:rgba(255,179,64,.13);color:var(--warn)}
.badge.accepted,.badge.approved,.badge.sent{background:rgba(48,199,123,.13);color:var(--ok)}
.badge.paid{background:var(--blue-t);color:#7db6ff}
.badge.declined,.badge.cancelled,.badge.rejected{background:rgba(255,77,94,.12);color:#ff6b79}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:12px;padding:3px;margin:0 0 12px;gap:3px;background:var(--s2)!important;border:0!important}
.seg button{padding:8px 4px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.seg button.active{background:var(--s4);color:var(--text)}
.offer{border-radius:16px;padding:12px;margin-bottom:8px}
.otop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;min-width:0}
.who .ava{width:26px;height:26px}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otime{color:var(--dim);font-size:11.5px;white-space:nowrap}
.swaprow{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:6px}
.side{background:var(--s2);border-radius:12px;padding:8px;min-width:0}
.side small{display:block;color:var(--dim);font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.6px;margin:0 0 6px 1px}
.minis{display:flex;flex-wrap:wrap;gap:5px}
.mini{width:42px;height:42px;border-radius:10px;overflow:hidden;background:var(--s3);position:relative;flex:none}
.mini img{width:100%;height:100%;object-fit:cover}
.mname{font-size:12px;font-weight:650;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff}
.arrow svg{width:15px;height:15px}
.oact{display:flex;gap:8px;margin-top:10px}
.oact .btn{flex:1;padding:10px;font-size:13px}
.quote{margin-top:10px;color:#cfd0d8;font-size:13px;background:var(--s2);border-radius:10px;padding:8px 10px}

.pcard{border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;margin:0 0 10px}
.pcard .ava{width:56px;height:56px;font-size:20px}
.pcard h3{margin:0;font-size:18px;letter-spacing:-.3px}
.pcard p{margin:3px 0 0;color:var(--muted);font-size:13px}
.adm{display:inline-flex;align-items:center;font-size:10.5px;font-weight:750;color:#7db6ff;background:var(--blue-t);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.list{border-radius:16px;margin:0 0 10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}
.row:active{background:var(--s2)}
.row .ri{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--blue-t);color:#7db6ff;flex:none}
.row .ri svg{width:16px;height:16px}
.row .rt{flex:1;font-size:14px;font-weight:600}
.row .rt small{display:block;color:var(--dim);font-size:11.5px;font-weight:500;margin-top:1px}
.row .rv{color:var(--muted);font-size:13px;display:flex}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0;color:#d0d1d8;font-size:13.5px;line-height:1.5}
.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:12px}
.steps b{color:#fff}

/* Нижнее меню как в Portals: иконка + подпись, активная — синяя */
.dock{position:fixed;z-index:30;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);width:min(440px,calc(100% - 20px));display:flex;align-items:stretch;padding:5px;border-radius:22px;
  background:rgba(22,22,25,.97);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.dock .nb{flex:1;position:relative;height:50px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7c7d86;transition:color .2s,background .25s var(--ease),transform .15s var(--ease)}
.dock .nb:active{transform:scale(.92)}
.dock .nb svg{width:22px;height:22px;flex:none}
.dock .nb .lbl{font-size:10.5px;font-weight:650;white-space:nowrap}
.dock .nb.active{color:var(--blue);background:var(--blue-t)}
.dock .dot{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:none;place-items:center;border:2px solid #161619}
.dock .dot.show{display:grid}

/* Нижний лист — сплошной, анимация только transform */
.sback{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.sback.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;margin:0 auto;bottom:0;width:min(560px,100%);max-height:90vh;overflow:auto;transform:translate3d(0,105%,0);transition:transform .42s cubic-bezier(.2,.9,.25,1);will-change:transform;overscroll-behavior:contain;
  background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;padding:6px 14px calc(16px + var(--safe-b));contain:layout paint}
.sheet.show{transform:translate3d(0,0,0)}
.sheet.drag{transition:none}
.sheet:not(.show){transition-duration:.28s;transition-timing-function:var(--ease)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--s4);margin:2px auto 10px}
.grabzone{padding:6px 0 2px;margin:-6px -14px 0;touch-action:none;cursor:grab}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shh h3{margin:0;font-size:18px;letter-spacing:-.3px}
.x{width:32px;height:32px;border-radius:50%;background:var(--s3);border:0;display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .15s var(--ease)}
.x svg{width:14px;height:14px}
.x:active{transform:scale(.9)}
.big{border-radius:18px;overflow:hidden;aspect-ratio:1;max-width:300px;margin:0 auto 12px;background:var(--s2);position:relative}
.big img{width:100%;height:100%;object-fit:cover}
.dtitle{text-align:center;margin-bottom:12px}
.dtitle h2{margin:0;font-size:22px;letter-spacing:-.4px}
.dtitle span{color:var(--muted);font-size:13px}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.attr{border-radius:12px;padding:8px 10px;min-width:0;background:var(--s2)!important;border:0!important}
.attr small{display:block;color:var(--dim);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.attr b{display:block;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attr i{font-style:normal;color:#7db6ff;font-size:11px;font-weight:700}
.orow{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 11px;margin-bottom:12px;background:var(--s2)!important;border:0!important}
.orow .ava{width:34px;height:34px}
.orow>div:not(.ava){flex:1;min-width:0}
.orow small{display:block;color:var(--dim);font-size:11px}
.orow b{font-size:14px}
.acts{display:grid;grid-template-columns:1fr auto;gap:8px}
.acts .sq{width:48px;height:auto}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:#c4c5cd;margin-bottom:12px;background:var(--s2)!important;border:0!important}
.note svg{width:17px;height:17px;flex:none;color:#7db6ff;margin-top:1px}
.note.warn{background:rgba(255,179,64,.09)!important;color:#ecd9ad}
.note.warn svg{color:var(--warn)}
.note b{color:#fff}
.ptarget{display:flex;align-items:center;gap:12px;border-radius:12px;padding:9px;margin-bottom:12px;background:var(--s2)!important;border:0!important}
.ptarget .mini{width:52px;height:52px}
.ptarget div{min-width:0}
.ptarget small{color:var(--dim);font-size:11px;display:block}
.ptarget b{font-size:14px}
.plabel{font-size:13px;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
@media(min-width:420px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pick{position:relative;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--s2);transition:border-color .15s,transform .15s var(--ease)}
.pick:active{transform:scale(.95)}
.pick img{aspect-ratio:1;width:100%;object-fit:cover}

<script>
'use strict';
/* =====================================================================
   GiftXchange — мини-приложение @GiftXchangebot
   • Внутри Telegram работает с сервером (server.js) по адресу API_BASE.
   • Вне Telegram (или с ?demo в адресе) включается ДЕМО: та же логика
     из core.js, но данные живут только в памяти этой вкладки.
   ===================================================================== */
const CONFIG = { API_BASE: '' }; // '' — тот же домен, где открыт server.js
const C = window.GXCore;
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const DEMO = !inTG || /[?&]demo\b/.test(location.search);

if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#05060a'); tg.setBackgroundColor && tg.setBackgroundColor('#05060a'); tg.setBottomBarColor && tg.setBottomBarColor('#05060a'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const haptic = (t = 'light') => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t) } catch (e) {} };
const notifyH = (t = 'success') => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t) } catch (e) {} };

/* ---------- Утилиты ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = n => '#' + Number(n).toLocaleString('ru-RU');
function plural(n, a, b, c) { n = Math.abs(n) % 100; const m = n % 10; if (n > 10 && n < 20) return c; if (m > 1 && m < 5) return b; if (m === 1) return a; return c; }
const giftsWord = n => `${n} ${plural(n, 'подарок', 'подарка', 'подарков')}`;
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return 'только что'; if (m < 60) return m + ' мин назад'; const h = Math.round(m / 60); if (h < 24) return h + ' ч назад'; const d = Math.round(h / 24); return d + ' ' + plural(d, 'день', 'дня', 'дней') + ' назад'; }
const initials = n => (n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const AV = ['#3d9bff,#7c5cff', '#ff8a5b,#ff5c8a', '#3ccf91,#2fa8ff', '#ffb547,#ff6b6b', '#8b5cf6,#ec4899', '#14b8a6,#6366f1'];
function ava(u, cls = '') {
  if (u && u.photo) return `<div class="ava ${cls}"><img src="${esc(u.photo)}" alt=""></div>`;
  const i = String((u && (u.id || u.name)) || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length;
  return `<div class="ava ${cls}" style="background:linear-gradient(140deg,${AV[i]})">${esc(initials(u && u.name))}</div>`;

// Точечное обновление: одинаковые элементы остаются на месте (картинки не пересоздаются),
// меняются только изменившиеся карточки. Так нет лишней работы и подвисаний.
const tpl = document.createElement('template');
function morph(el, h) {
  if (el._h === h) return; el._h = h;
  tpl.innerHTML = h; patchKids(el, tpl.content);
}
function patchKids(oldP, newP) {
  const pool = new Map();
  for (const c of [...oldP.children]) { const k = c.outerHTML; (pool.get(k) || pool.set(k, []).get(k)).push(c); }
  const oldList = [...oldP.children], next = [];
  [...newP.children].forEach((n, i) => {
    const same = pool.get(n.outerHTML);
    if (same && same.length) { next.push(same.shift()); return; }
    const o = oldList[i];
    if (o && !next.includes(o) && o.tagName === n.tagName && o.className === n.className && (o.classList.contains('grid') || o.classList.contains('list'))) { patchKids(o, n); next.push(o); return; }
    next.push(n);
  });
  // удаляем лишнее и расставляем в нужном порядке с минимумом перемещений
  const keep = new Set(next);
  for (const c of [...oldP.children]) if (!keep.has(c)) c.remove();
  next.forEach((n, i) => { const cur = oldP.children[i]; if (cur !== n) oldP.insertBefore(n, cur || null); });
}

function minis(gs) {

function offerLists(list) {

// Оплата счётом Telegram Stars
async function payInvoice(wid, r, btn) {
  if (DEMO) {
    const w = D().withdrawals.find(x => x.id === wid);
    openSheet(`${head('Telegram Stars · демо')}
      <div class="feebox"><span class="s">${I.star}</span><div><b>${w ? w.fee : 50} звёзд</b><span>В настоящем приложении здесь откроется окно оплаты Telegram</span></div></div>
      <div class="btnrow"><button class="btn danger" data-wcancel="${esc(wid)}">Отменить вывод</button><button class="btn star" data-demopay="${esc(wid)}">Оплатить</button></div>`, 'pay');
    return;
  }
  if (!r || !r.invoiceLink) r = await act('payWithdrawal', { id: wid }, null, { btn });
  if (!r || !r.invoiceLink) return;
  closeSheet();
  try { tg.openInvoice(r.invoiceLink, async status => {
    if (status === 'paid') {
      notifyH('success'); toast('Оплата прошла. Подарок скоро придёт');
      for (let i = 0; i < 6; i++) { await new Promise(x => setTimeout(x, 1500)); await reload(); const w = D().withdrawals.find(x => x.id === wid); if (w && w.status !== 'awaiting_payment') break; }
    } else if (status === 'failed') toast('Оплата не прошла', true);
    else if (status === 'cancelled') toast('Оплата отменена. Оплатить можно позже в «Мои NFT»');
  }); } catch (e) { openLink(r.invoiceLink); }
}

/* =====================================================================
   События
   ===================================================================== */
const isManual = () => (DEMO ? Demo.ctx.paymentMode : D().paymentMode) === 'manual';
function go(v) {
  if (!TITLES[v]) return;
  if (modalCb) closeModal(false);
  if (sheetOpen) closeSheet();
  if (S.view === v) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  S.view = v; S.filter = 'all'; S.enter = true; haptic('light'); render(); window.scrollTo(0, 0);
  try { v === 'market' ? tg.BackButton.hide() : tg.BackButton.show() } catch (e) {}
}
function toggleFav(id) { S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); saveFavs(); haptic('light'); toast(S.favs.has(id) ? 'Добавлено в избранное' : 'Убрано из избранного'); }
// Собственное окно подтверждения: работает везде (системные confirm() блокируются во встроенных окнах)
let modalCb = null;
function confirmBox(text, okLabel = 'Подтвердить', kind = '', icon = I.info) {
  return new Promise(r => {
    if (modalCb) modalCb(false);
    modalCb = r;
    $('mtext').textContent = text; $('mok').textContent = okLabel; $('mok').className = 'btn ' + kind; $('mic').innerHTML = icon;
    $('modal').classList.add('show'); haptic('medium');
    setTimeout(() => $('mok').focus({ preventScroll: true }), 50);
  });
}
function closeModal(v) { $('modal').classList.remove('show'); const cb = modalCb; modalCb = null; if (cb) cb(v); }
let reasonCb = null;
function promptBox(title) {
  return new Promise(res => {
    reasonCb = res;
    openSheet(`${head(title)}<input class="field" id="reasonInp" maxlength="200" placeholder="Например: подарок не пришёл"><div class="btnrow"><button class="btn sec" data-act="close">Назад</button><button class="btn danger" id="reasonOk">Отклонить</button></div>`, 'reason');
  });
}

document.addEventListener('click', async e => {
  if (e.target.id === 'modal') return closeModal(false);
  const el = e.target.closest('button,[data-open],[data-wopen]');
  if (!el) return;
  if (el.id === 'mok') return closeModal(true);
  if (el.id === 'mcancel') return closeModal(false);
  const d = el.dataset;
  const card = el.closest('.offer,.item');
  if (d.act === 'more') { S.marketLimit += 24; haptic('light'); return render(); }
  if (d.link) { e.preventDefault(); e.stopPropagation(); return openLink(d.link); }
  if (d.fav) {
    e.stopPropagation(); toggleFav(d.fav); const on = S.favs.has(d.fav);
    if (sheetKind.startsWith('gift:')) { openGift(d.fav, true); const b = document.querySelector('#sbody [data-fav]'); b && b.classList.add('pop'); }
    document.querySelectorAll(`.favb[data-fav="${CSS.escape(d.fav)}"]`).forEach(b => { b.classList.toggle('on', on); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); });
    if ((S.view === 'market' && S.filter === 'fav') || S.view === 'favorites' || S.view === 'profile') render(); else { renderChips(D().market); $('content')._h = null; }
    return;
  }
  if (d.offer) { e.stopPropagation(); haptic('medium'); return openOffer(d.offer); }
  if (d.pick) { pick.has(d.pick) ? pick.delete(d.pick) : pick.add(d.pick); haptic('light'); return updatePick(); }
  if (d.withdraw) { e.stopPropagation(); return openWithdraw(d.withdraw); }
  if (d.wpay || d.wopen) {
    e.stopPropagation();
    const id = d.wpay || d.wopen, w = D().withdrawals.find(x => x.id === id);
    if (!w) return toast('Заявка на вывод уже неактуальна', true);
    return isManual() ? openManualPay(w) : payInvoice(w.id, null, el);
  }
  if (d.demopay) { el.classList.add('loading'); await sleep(450); S.data = Demo.demoPay(d.demopay); closeSheet(); notifyH(); toast('Оплачено. Заявка ушла администратору'); return render(); }
  if (d.wclaim) { const r = await act('claimManualPayment', { id: d.wclaim }, 'Спасибо. Администратор проверит оплату', { btn: el }); if (r) closeSheet(); return; }
  if (d.wcancel) { const r = await act('cancelWithdrawal', { id: d.wcancel }, 'Вывод отменён, подарок снова доступен', { btn: el }); if (r) closeSheet(); return; }
  if (d.dcancel) { if (await confirmBox('Отменить заявку на зачисление?', 'Отменить заявку', 'danger', I.x)) await act('cancelDeposit', { id: d.dcancel }, 'Заявка отменена', { row: card }); return; }
  if (d.dapprove) { if (await confirmBox('Подарок точно пришёл на @' + D().relayer + ' от этого пользователя?', 'Зачислить', 'okb', I.check.replace('#fff', 'currentColor'))) await act('approveDeposit', { id: d.dapprove }, 'Подарок зачислен владельцу', { row: card }); return; }
  if (d.dreject) { const reason = await promptBox('Отклонить заявку'); if (reason !== null) await act('rejectDeposit', { id: d.dreject, reason }, 'Заявка отклонена', { row: document.querySelector(`[data-dreject="${CSS.escape(d.dreject)}"]`)?.closest('.offer') }); return; }
  if (d.wsent) { if (await confirmBox('Вы отправили подарок пользователю с аккаунта @' + D().relayer + '?', 'Да, отправил', 'okb', I.send)) await act('adminMarkSent', { id: d.wsent }, 'Вывод завершён', { row: card }); return; }
  if (d.wconfirm) { if (await confirmBox('Звёзды от пользователя пришли на @' + D().relayer + '?', 'Оплата пришла', 'okb', I.star)) await act('adminConfirmPayment', { id: d.wconfirm }, 'Оплата подтверждена', { btn: el }); return; }
  if (d.wreject) { const reason = await promptBox('Отклонить вывод'); if (reason !== null) await act('adminRejectWithdrawal', { id: d.wreject, reason }, 'Вывод отклонён, подарок возвращён в профиль', { row: document.querySelector(`[data-wreject="${CSS.escape(d.wreject)}"]`)?.closest('.offer') }); return; }
  if (d.open) { haptic('light'); return openGift(d.open); }
  if (d.go) return go(d.go);
  if (d.filter) { if (S.filter !== d.filter) { S.filter = d.filter; S.enter = true; haptic('light'); render(); } return; }
  if (d.otab) { if (S.offerTab !== d.otab) { S.offerTab = d.otab; S.enter = true; haptic('light'); render(); } return; }
  if (d.atab) { if (S.adminTab !== d.atab) { S.adminTab = d.atab; S.enter = true; haptic('light'); render(); } return; }
  if (d.sort) { S.sort = d.sort; S.enter = true; closeSheet(); return render(); }
  if (d.oact) {
    const msgs = { acceptOffer: 'Обмен совершён. Подарки уже в профилях', declineOffer: 'Заявка отклонена', cancelOffer: 'Заявка отменена' };
    if (d.oact === 'acceptOffer') {
      const o = D().offers.find(x => x.id === d.id); const ids = new Set(o ? [...o.give, ...o.get].map(g => g.id) : []);
      const clash = D().offers.filter(x => x.id !== d.id && x.status === 'pending' && [...x.give, ...x.get].some(g => ids.has(g.id))).length;
      const warn = clash ? `\n\nДругие заявки с этими подарками (${clash}) будут отменены автоматически.` : '';
      if (!(await confirmBox('Принять обмен? Подарки сразу поменяются владельцами.' + warn, 'Принять обмен', 'okb', I.swap))) return;
      const r = await act('acceptOffer', { id: d.id }, null, { btn: el });
      if (r) { notifyH('success'); toast(clash ? `Обмен совершён. Отменено других заявок: ${clash}` : msgs.acceptOffer); }
      return;
    }
    if (d.oact === 'declineOffer' && !(await confirmBox('Отклонить предложение обмена?', 'Отклонить', 'danger', I.x))) return;
    if (d.oact === 'cancelOffer' && !(await confirmBox('Отменить вашу заявку на обмен?', 'Отменить заявку', 'danger', I.x))) return;
    return act(d.oact, { id: d.id }, msgs[d.oact], { btn: el });
  }
  if (el.id === 'sendOffer') {
    if (!pick.size) return;
    const r = await act('createOffer', { give: [...pick], get: [d.target], comment: $('offerComment').value.trim() }, 'Предложение отправлено', { btn: el });
    if (r) { closeSheet(); S.offerTab = 'out'; }
    return;
  }
  if (el.id === 'depBtn') {
    const r = await act('createDeposit', { link: $('depLink').value }, 'Заявка отправлена на проверку', { btn: el });
    if (r) { closeSheet(); go('mine'); }
    return;
  }
  if (el.id === 'regBtn') {
    if (!C.parseLink($('regLink').value)) return toast('Вставьте ссылку на подарок, например https://t.me/nft/PlushPepe-1', true);
    if (!$('regOwner').value.trim()) return toast('Укажите @username или ID владельца', true);
    const r = await act('adminRegister', { link: $('regLink').value, owner: $('regOwner').value }, 'NFT зарегистрирован', { btn: el });
    if (r) { $('regLink').value = ''; $('regOwner').value = ''; $('regPreview').innerHTML = ''; }
    return;
  }
  if (el.id === 'wBtn') {
    const r = await act('requestWithdrawal', { giftId: d.gift }, null, { btn: el });
    if (!r) return;
    const w = D().withdrawals.find(x => x.giftId === d.gift && x.status === 'awaiting_payment');
    if (!w) { closeSheet(); return toast('Заявка на вывод создана'); }
    if (isManual()) return openManualPay(w);
    return payInvoice(w.id, r);
  }
  if (el.id === 'reasonOk') { const v = $('reasonInp').value.trim(); const cb = reasonCb; reasonCb = null; closeSheet(); cb && cb(v); return; }
  if (el.id === 'sortBtn') return openSort();
  if (el.id === 'clearSearch') { e.preventDefault(); $('search').value = ''; return render(); }
  if (d.act) {
    const A = {
      close: closeSheet, how: openHow, add: openAdd, history: openHistory,
      reset: () => { $('search').value = ''; S.filter = 'all'; render(); },
      copyRelayer: () => copyText('@' + D().relayer).then(ok => toast(ok ? 'Скопировано: @' + D().relayer : '@' + D().relayer)),
      demoMode: () => { Demo.ctx.paymentMode = Demo.ctx.paymentMode === 'invoice' ? 'manual' : 'invoice'; toast(Demo.ctx.paymentMode === 'invoice' ? 'Оплата счётом Telegram Stars' : 'Оплата вручную на @' + D().relayer); render(); }
    };
    (A[d.act] || (() => {}))();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') { clearTimeout(window._st); window._st = setTimeout(render, 120); $('searchBox').classList.toggle('has', !!e.target.value); }
  if (e.target.id === 'depLink') linkPreview('depLink', 'depPreview', 'depBtn');
  if (e.target.id === 'regLink') linkPreview('regLink', 'regPreview');
});
$('sback').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalCb) return closeModal(false);
  if (e.key === 'Escape' && sheetOpen) closeSheet();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.card[data-open]')) openGift(e.target.dataset.open);
});
try { tg.BackButton.onClick(() => modalCb ? closeModal(false) : sheetOpen ? closeSheet() : go('market')); } catch (e) {}
// Свайп вниз по шапке листа — закрыть
(() => {
  const sh = $('sheet'); let y0 = null, dy = 0;
  const start = e => { if (sh.scrollTop > 0 && !e.target.closest('#grab')) return; y0 = (e.touches ? e.touches[0] : e).clientY; dy = 0; };
  const move = e => { if (y0 === null) return; dy = Math.max(0, (e.touches ? e.touches[0] : e).clientY - y0); if (dy > 4) { sh.classList.add('drag'); sh.style.transform = `translate3d(0,${dy}px,0)`; if (e.cancelable && e.touches) e.preventDefault(); } };
  const end = () => { if (y0 === null) return; y0 = null; sh.classList.remove('drag'); sh.style.transform = ''; if (dy > 110) closeSheet(); dy = 0; };
  $('grab').addEventListener('touchstart', start, { passive: true }); $('grab').addEventListener('mousedown', start);
  // touchmove только на ручке листа — прокрутка страницы не блокируется
  $('grab').addEventListener('touchmove', move, { passive: false }); $('grab').addEventListener('touchend', end); $('grab').addEventListener('touchcancel', end);
  window.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
})();
